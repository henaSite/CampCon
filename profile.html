<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Campus Connect (CampCon)</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/phase1-polish.css" />
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 820px) {
      .profile-layout {
        grid-template-columns: 340px 1fr;
        align-items: start;
      }
    }
    .card-box {
      background: var(--card-bg, #ffffff);
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 0.85rem;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .avatar-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--accent-primary, #2563eb);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 800;
      margin: 0 auto 0.85rem;
      overflow: hidden;
    }
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .form-field {
      margin-bottom: 1rem;
    }
    .form-field label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
    }
    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color, #d1d5db);
      background: var(--bg-primary, #f9fafb);
      color: var(--text-primary, #111827);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .my-report-item {
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 0.65rem;
      padding: 1rem;
      margin-bottom: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }
    .status-pill {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-pending {
      background: rgba(245, 158, 11, 0.16);
      color: #d97706;
    }
    .status-approved {
      background: rgba(16, 185, 129, 0.16);
      color: #059669;
    }
    .status-rejected {
      background: rgba(239, 68, 68, 0.16);
      color: #dc2626;
    }
    .status-recovered {
      background: rgba(59, 130, 246, 0.16);
      color: #2563eb;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container" style="display:flex;align-items:center;justify-content:space-between;padding:1rem 0;">
      <a href="dashboard.html" class="brand-logo" style="font-weight:800;font-size:1.25rem;text-decoration:none;">
        CampCon
      </a>
      <nav style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
        <a href="dashboard.html">Feed</a>
        <a href="inbox.html">Inbox</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="about.html">About</a>
        <a href="admin.html" id="navAdminLink" style="display:none;font-weight:700;">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 1.5rem 1rem 3rem;">
    <section style="margin-bottom: 1.5rem;">
      <h1 style="margin-bottom: 0.25rem;">My Campus Profile</h1>
      <p style="color: var(--text-secondary, #6b7280);">
        Update your contact information and manage your submitted Lost &amp; Found reports.
      </p>
    </section>

    <div id="profileBanner" style="display:none;padding:0.85rem 1rem;border-radius:0.5rem;margin-bottom:1rem;"></div>

    <div class="profile-layout">
      <!-- Left Column: Edit Profile -->
      <aside class="card-box">
        <div style="text-align:center;margin-bottom:1.25rem;">
          <div id="avatarDisplay" class="avatar-circle">U</div>
          <h2 id="displayNameHeading" style="margin:0 0 0.2rem;font-size:1.2rem;">Campus Member</h2>
          <p id="displayEmailText" style="margin:0;font-size:0.85rem;color:var(--text-secondary,#6b7280);">Loading...</p>
          <span id="displayRoleBadge" style="display:inline-block;margin-top:0.5rem;font-size:0.75rem;padding:0.2rem 0.65rem;border-radius:999px;background:var(--bg-primary,#f3f4f6);font-weight:600;">
            Member
          </span>
        </div>

        <form id="profileForm">
          <div class="form-field">
            <label for="fullNameInput">Full Name *</label>
            <input type="text" id="fullNameInput" placeholder="Your full name" required />
          </div>

          <div class="form-field">
            <label for="phoneInput">Phone Number</label>
            <input type="tel" id="phoneInput" placeholder="e.g., +234 800 000 0000" />
          </div>

          <div class="form-field">
            <label for="avatarUrlInput">Avatar Image URL (optional)</label>
            <input type="url" id="avatarUrlInput" placeholder="https://..." />
          </div>

          <button type="submit" class="btn btn-primary" id="saveProfileBtn" style="width:100%;">
            Save Profile Changes
          </button>
        </form>
      </aside>

      <!-- Right Column: My Reports -->
      <section class="card-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;">
          <h2 style="margin:0;font-size:1.2rem;">My Submitted Reports</h2>
          <a href="dashboard.html" class="btn btn-outline" style="font-size:0.85rem;padding:0.4rem 0.85rem;text-decoration:none;">
            + New Report
          </a>
        </div>

        <div id="myReportsList">
          <p style="color: var(--text-secondary, #6b7280);">Loading your reports...</p>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
