<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Campus Connect</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-theme="light">
    <div class="app-shell">
      <header class="topbar">
        <div class="container navbar">
          <a class="brand" href="../index.html">
            <span class="brand-mark"><img src="../assets/logo.svg" alt="" /></span>
            <span>Campus Connect</span>
          </a>
          <div class="nav-actions">
            <a class="button button-secondary" href="./login.html">Back to login</a>
          </div>
        </div>
      </header>

      <main class="auth-page">
        <section class="auth-card">
          <h1>Reset password</h1>
          <p class="subtitle">Choose how you want to recover access to your account.</p>

          <div class="theme-panel">
            <div class="theme-option" aria-label="Email recovery option" style="padding: 16px;">
              <span class="theme-swatch" style="background: linear-gradient(135deg, #dbeafe, #2563eb);"></span>
              <div>
                <strong>Email recovery</strong><br />
                <span class="form-help">Send a secure reset link</span>
              </div>
            </div>
            <div class="theme-option" aria-label="Phone recovery option" style="padding: 16px;">
              <span class="theme-swatch" style="background: linear-gradient(135deg, #dcfce7, #16a34a);"></span>
              <div>
                <strong>Phone recovery</strong><br />
                <span class="form-help">Verify OTP and create a new password</span>
              </div>
            </div>
          </div>

          <form data-validate style="margin-top: 24px;">
            <div class="form-grid">
              <div class="field">
                <label for="recoveryMethod">Recovery method</label>
                <select id="recoveryMethod" name="recoveryMethod" required>
                  <option value="">Choose one</option>
                  <option value="email">Email</option>
                  <option value="phone">Phone</option>
                </select>
              </div>

              <div class="field">
                <label for="recoveryValue">Email address or phone number</label>
                <input id="recoveryValue" name="recoveryValue" type="text" placeholder="you@example.com or +1234567890" required />
              </div>

              <button class="button button-primary" type="submit">Send recovery link</button>
              <div class="status-message" aria-live="polite"></div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
