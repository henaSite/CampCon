<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to your Campus Connect account." />
    <title>Log in | Campus Connect</title>
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" /><link rel="stylesheet" href="../css/styles.css" /><link rel="stylesheet" href="../css/phase1-polish.css" />
  </head>
  <body data-theme="light"><div class="app-shell">
    <header class="topbar"><div class="container navbar"><a class="brand" href="../index.html"><span class="brand-mark"><img src="../assets/logo.svg" alt="" /></span><span>Campus Connect</span></a><div class="nav-actions"><a class="button button-secondary" href="./register.html">Create account</a></div></div></header>
    <main class="auth-page"><section class="auth-card"><a class="auth-back" href="../index.html">← Back to home</a><span class="eyebrow">Welcome back</span><h1>Good to see you.</h1><p class="subtitle">Log in to reconnect with your campus community.</p>
      <form data-auth-form="login" novalidate><div class="form-grid"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required /></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required /></div><div class="inline-row"><label class="remember-option"><input name="remember" type="checkbox" checked /> Keep me signed in</label><a href="./forgot-password.html">Forgot password?</a></div><button class="button button-primary auth-submit" type="submit">Log in <span aria-hidden="true">→</span></button><div class="status-message" role="status" aria-live="polite"></div></div></form>
      <p class="auth-switch">New to Campus Connect? <a href="./register.html">Create an account</a></p>
    </section></main>
  </div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script></body>
</html>
