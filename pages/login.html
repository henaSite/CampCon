<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Campus Connect</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-theme="light">
    <div class="app-shell">
      <header class="topbar">
        <div class="container navbar">
          <a class="brand" href="../index.html">
            <span class="brand-mark"><img src="../assets/logo.svg" alt="" /></span>
            <span>Campus Connect</span>
          </a>
          <div class="nav-actions">
            <a class="button button-secondary" href="./register.html">Register</a>
          </div>
        </div>
      </header>

      <main class="auth-page">
        <section class="auth-card">
          <h1>Welcome back</h1>
          <p class="subtitle">Sign in to view reports, inbox updates and your profile.</p>

          <form data-validate>
            <div class="form-grid">
              <div class="field">
                <label for="identifier">Email address or phone number</label>
                <input id="identifier" name="identifier" type="text" placeholder="you@example.com or +1234567890" required />
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required />
              </div>

              <div class="inline-row">
                <label><input type="checkbox" /> Remember me</label>
                <a href="./forgot-password.html" style="color: var(--primary); font-weight: 700;">Forgot password?</a>
              </div>

              <button class="button button-primary" type="submit">Login</button>
              <div class="status-message" aria-live="polite"></div>
            </div>
          </form>

          <p class="form-help" style="margin-top: 18px; text-align: center;">
            Need an account? <a href="./register.html" style="color: var(--primary); font-weight: 700;">Create one</a>
          </p>
        </section>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
