<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Choose a new Campus Connect password." /><title>Choose a new password | Campus Connect</title><link rel="icon" href="../assets/logo.svg" type="image/svg+xml" /><link rel="stylesheet" href="../css/styles.css" /><link rel="stylesheet" href="../css/phase1-polish.css" /><link rel="stylesheet" href="../css/phase2-auth.css" /></head>
  <body data-theme="light"><div class="app-shell"><header class="topbar"><div class="container navbar"><a class="brand" href="../index.html"><span class="brand-mark"><img src="../assets/logo.svg" alt="" /></span><span>Campus Connect</span></a><div class="nav-actions"><a class="button button-secondary" data-auth-guest href="./login.html">Back to login</a></div></div></header><main class="auth-page"><section class="auth-card"><a class="auth-back" href="./login.html">← Back to login</a><span class="eyebrow">Secure account recovery</span><h1>Choose a new password</h1><p class="subtitle">Use at least 10 characters, including uppercase, lowercase, and a number.</p><form data-auth-form="update-password" novalidate><div class="form-grid"><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required /></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required /></div><button class="button button-primary auth-submit" type="submit">Update password</button><div class="status-message" role="status" aria-live="polite"></div></div></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script></body>
</html>
