<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Create your Campus Connect account." />
    <title>Create account | Campus Connect</title><link rel="icon" href="../assets/logo.svg" type="image/svg+xml" /><link rel="stylesheet" href="../css/styles.css" /><link rel="stylesheet" href="../css/phase1-polish.css" /><link rel="stylesheet" href="../css/phase2-auth.css" />
  </head>
  <body data-theme="light"><div class="app-shell"><header class="topbar"><div class="container navbar"><a class="brand" href="../index.html"><span class="brand-mark"><img src="../assets/logo.svg" alt="" /></span><span>Campus Connect</span></a><div class="nav-actions"><a class="button button-secondary" data-auth-guest href="./login.html">Log in</a></div></div></header>
    <main class="auth-page"><section class="auth-card"><a class="auth-back" href="../index.html">← Back to home</a><span class="eyebrow">Your campus, connected</span><h1>Create your account</h1><p class="subtitle">Join your community and help belongings find their way home.</p>
      <form data-auth-form="register" novalidate><div class="form-grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" autocomplete="name" minlength="2" maxlength="100" placeholder="Your full name" required /></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+1234567890" aria-describedby="phone-help" required /><small class="field-hint" id="phone-help">Include your country code (international format).</small></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required /></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" placeholder="At least 10 characters" aria-describedby="password-help" required /><small class="field-hint" id="password-help">Use 10+ characters with uppercase, lowercase, and a number.</small></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" placeholder="Enter your password again" required /></div><button class="button button-primary auth-submit" type="submit">Create account <span aria-hidden="true">→</span></button><div class="status-message" role="status" aria-live="polite"></div></div></form>
      <p class="auth-switch">Already have an account? <a href="./login.html">Log in</a></p>
    </section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script></body>
</html>
